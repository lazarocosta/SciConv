---
# Infer dataset-level metadata from a research article
tags:
  - Article
consumes:
  - application/json   # ← alterado: o endpoint espera JSON no body (request.get_json())
produces:
  - application/json
parameters:
  - name: article_uuid
    in: path
    required: true
    type: string
    description: Unique identifier of the article processing session (e.g. 20250130_143022)
  - name: Authorization
    in: header
    required: true
    type: string
    default: "Bearer my-secret-token"
    description: Bearer authentication token.
  - name: max_return
    in: formData
    required: false
    type: integer
    default: 5
    description: Maximum number of metadata objects to infer and return.
responses:
  200:
    description: >
      Metadata inferred successfully. Returns the standard application response format 
      with a list of messages (the last one usually containing the inferred Zenodo metadata 
      in `contentShort` and `content` under `zenodo_metadata`).
    schema:
      type: object
      properties:
        actions:
          type: array
          items:
            type: string
          example: ["create", "update metadata"]
        messages:
          type: array
          items:
            type: object
            properties:
              role:
                type: string
                example: "assistant"
              jsonObject:
                type: boolean
                example: true
              contentShort:
                type: object
                description: Short/summary version for UI
              content:
                type: object
                description: Full payload with inferred metadata
                properties:
                  zenodo_metadata:
                    type: array
                    items:
                      type: object
                      properties:
                        metadata:
                          type: object
                          additionalProperties: true
                  template:
                    type: object
                    additionalProperties: true
              stage:
                type: string
                example: "DatasetMetadataInferenceCompleted"