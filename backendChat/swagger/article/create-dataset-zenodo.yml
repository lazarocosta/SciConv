Create a new Zenodo dataset deposition with user-supplied metadata and files
---
tags:
  - Article

consumes:
  - multipart/form-data
produces:
  - application/json

parameters:
  - name: Authorization
    in: header
    required: true
    type: string
    default: "Bearer my-secret-token"
    description: >
      Bearer authentication token for YOUR application (not Zenodo).

  - name: article_uuid
    in: path
    required: true
    default: "12345678"
    type: string
    description: UUID of the article session/folder used by the application.

  - name: zenodo_token
    in: formData
    required: false
    type: string
    description: >
      The user's personal Zenodo API token.
      This token determines *which Zenodo account* will receive the deposition.
      The app does NOT use any global token; the upload is done per user.

  - name: metadata
    in: formData
    required: true
    type: string
    default: |
      {
        "metadata": {
          "upload_type": "dataset",
          "publication_date": "2025-12-22",
          "title": "Example Dataset: Coastal Temperature Measurements (2018–2024)",
          "creators": [
            {
              "name": "Doe, Jane",
              "affiliation": "Example University",
              "orcid": "0000-0002-1694-233X",
              "gnd": ""
            }
          ],
          "contributors": [
            {
              "name": "Smith, John",
              "type": "DataCurator",
              "affiliation": "Example Data Center",
              "orcid": "",
              "gnd": ""
            }
          ],
          "description": "<p>This dataset contains hourly coastal sea-surface temperature measurements from three sensor stations collected between 2018 and 2024. Data are provided as CSV files with accompanying README documentation and quality-control flags.</p>",
          "access_right": "open",
          "license": "cc-by-4.0",
          "embargo_date": "",
          "access_conditions": "",
          "doi": "",
          "preserve_doi": false,
          "keywords": [
            "sea surface temperature",
            "coastal monitoring",
            "oceanography",
            "time series"
          ],
          "notes": "<p>Quality control applied: outlier removal using median absolute deviation and sensor drift correction.</p>",
          "references": [
            "Doe J (2024). Coastal monitoring methods. Example Publisher. DOI:10.1234/example.ref1",
            "Smith J (2023). Temperature sensor calibration. Example Publisher. DOI:10.1234/example.ref2"
          ],
          "related_identifiers": [
            {
              "identifier": "10.1234/example.software",
              "relation": "isDocumentedBy",
              "resource_type": "software"
            },
            {
              "identifier": "https://example.org/project-page",
              "relation": "isSupplementTo",
              "resource_type": "other"
            }
          ],
          "communities": [
            {
              "identifier": "ecfunded"
            }
          ],
          "grants": [
            {
              "id": "10.13039/501100000780::283595"
            }
          ],
          "journal": {
            "title": "",
            "volume": "",
            "issue": "",
            "pages": ""
          },
          "conference": {
            "title": "20th International Conference on Coastal Observations",
            "acronym": "ICCO24",
            "dates": "14-18 October 2024",
            "place": "Amsterdam, The Netherlands",
            "url": "https://example.org/icco24",
            "session": "VI",
            "session_part": "1"
          },
          "imprint": {
            "publisher": "",
            "isbn": "",
            "place": ""
          },
          "part_of": {
            "title": "",
            "pages": ""
          },
          "thesis": {
            "supervisors": [],
            "university": ""
          },
          "subjects": [
            {
              "term": "Oceanography",
              "identifier": "http://id.loc.gov/authorities/subjects/sh85093990",
              "scheme": "url"
            }
          ],
          "version": "1.0.0",
          "language": "eng",
          "locations": [
            {
              "lat": 34.0257,
              "lon": -118.7804,
              "place": "Los Angeles, USA",
              "description": "Station LA-01 (nearshore buoy)."
            },
            {
              "lat": 37.7749,
              "lon": -122.4194,
              "place": "San Francisco, USA",
              "description": "Station SF-02 (pier-mounted sensor)."
            }
          ],
          "dates": [
            {
              "start": "2018-03-21",
              "end": "2024-03-25",
              "type": "Collected",
              "description": "Primary measurement collection period."
            }
          ],
          "method": "<p>Sea-surface temperature was recorded hourly using calibrated thermistor sensors. Data were transmitted via cellular telemetry, aggregated daily, and validated using automated QC rules and manual spot checks.</p>"
        }
      }
    description: >
      JSON string containing the dataset metadata in Zenodo deposition format
  - name: files
    in: formData
    required: false
    type: file
    description: >
      One or more files to upload to Zenodo (ZIP, CSV, images, code, etc.).
      Use "files[]" if uploading multiple files.

responses:
  200:
    description: >
      Dataset successfully created on Zenodo.  
      Returns the full deposition JSON object from Zenodo,
      including deposition ID, links, bucket URL, and metadata.
    schema:
      type: array
      items:
        type: object
        properties:
          role:
            type: string
          jsonObject:
            type: boolean
          contentShort:
            type: string
            description: A short summary of the Zenodo creation result.
          content:
            description: >
              Full Zenodo deposition response, e.g.:
              {
                "id": 1234567,
                "metadata": {...},
                "links": {
                  "bucket": "...",
                  "self": "...",
                  "html": "...",
                  "publish": "..."
                }
              }
          stage:
            type: string
            description: Workflow stage indicator.

  400:
    description: >
      Bad request — token missing, metadata missing, or invalid JSON.

  401:
    description: Unauthorized — invalid Authorization header for this application.

  500:
    description: Unexpected server error while creating or uploading to Zenodo.
